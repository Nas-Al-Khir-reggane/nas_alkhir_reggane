name: nas_al_kheir
description: "Nas Al Kheir Charity App"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2
  fl_chart: ^1.2.0
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  pdf: ^3.12.0
  printing: ^5.14.3
  arabic_reshaper: ^0.0.1
  shared_preferences: ^2.5.4
  connectivity_plus: ^6.1.1
  get: ^4.7.3
  google_fonts: ^6.2.1
  animate_do: ^3.3.0
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  share_plus: ^7.2.1
  flutter_staggered_animations: ^1.0.0
  screenshot: ^3.0.0
  flutter_markdown: ^0.7.3+1
  shimmer: ^3.0.0
  swipe_to: ^1.0.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  qr_flutter: ^4.1.0
  timezone: ^0.11.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  package_info_plus: ^9.0.1
  audioplayers: ^6.1.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  flutter_animate: ^4.5.2
  http: ^1.6.0
  path: ^1.9.1
  record: ^5.1.0
  permission_handler: ^11.3.1
  flutter_svg: ^2.2.4
  flutter_background_service: ^5.1.0

  wakelock_plus: ^1.5.1
  firebase_crashlytics: ^5.1.0
  firebase_analytics: ^12.2.0
  excel: ^4.0.6
  flutter_timezone: ^5.0.2

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/nas_alkhir_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/nas_alkhir_app.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
