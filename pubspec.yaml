name: nas_al_kheir
description: "Nas Al Kheir Charity App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2
  fl_chart: ^1.2.0
  google_maps_flutter: ^2.16.0
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.4
  get: ^4.7.3
  google_fonts: ^6.2.1
  animate_do: ^3.3.0
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  share_plus: ^7.2.1
  flutter_staggered_animations: ^1.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
