name: '🚀 Build & Release APK'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 🏗️ Build APKs (Universal & Split)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: 🏷️ Rename APKs for Website Compatibility
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NasAlKhir_CHAMILA.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/NasAlKhir_NEW.PHONE.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/NasAlKhir_OLD.PHONE.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/NasAlKhir_TABLET.apk

      - name: 📝 Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: 'ناس الخير ${{ steps.version.outputs.version }}'
          body: |
            ## 🌿 إصدار جديد من تطبيق ناس الخير
            
            ### التحميل
            حمّل ملف APK أدناه وثبّته على هاتفك.
            
            ---
            _بُني تلقائياً بتاريخ ${{ github.event.head_commit.timestamp }}_
          files: build/app/outputs/flutter-apk/NasAlKhir_*.apk
          draft: false
          prerelease: false
